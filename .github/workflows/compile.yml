name: Compile
run-name: "Compile ${{ inputs.leg || github.event_name }} ${{ inputs.racecar_run }}"
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      leg:
        description: "baseline (uninstrumented) or instrumented (under chalk/curiosity)"
        type: choice
        options: [instrumented, baseline]
        default: baseline
      profile:
        description: "CrashOverride chalk profile"
        type: string
        default: curiosity-tests-racecar
      racecar_run:
        description: "racecar correlation token, echoed into the run name"
        type: string
        default: ""

env:
  CHALK_ON: ${{ inputs.leg == 'instrumented' }}
jobs:
  compile:
    name: Compile
    uses: | # zizmor: ignore[unpinned-uses] same maintainer as this repo
      emacscollective/workflows/.github/workflows/compile.yml@main
    permissions: {}
